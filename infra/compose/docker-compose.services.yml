    image: ppms/parent-flock-service:${TAG:-dev}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ppms_parent_flock
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public
      ADMIN_SERVICE_URL: http://admin-service:8085
    secrets: [jwt_public]
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"], interval: 15s, retries: 10 }
    profiles: [services]

  hatchery-service:

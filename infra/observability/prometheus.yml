global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ppms-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'identity-service:8084'
          - 'admin-service:8085'
          - 'parent-flock-service:8081'
          - 'hatchery-service:8082'
          - 'farm-service:8083'
          - 'slaughterhouse-service:8086'
          - 'notification-service:8087'
          - 'reporting-service:8088'
          - 'gateway-service:8080'

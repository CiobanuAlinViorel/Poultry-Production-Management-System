apiVersion: v1
kind: Secret
metadata:
  name: ppms-secrets
  labels:
    {{- include "ppms.labels" (dict "name" "ppms-secrets" "Release" .Release) | nindent 4 }}
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: {{ .Values.postgres.user | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.postgres.password | quote }}
  JWT_PUBLIC_KEY: {{ .Values.jwt.publicKey | quote }}
  JWT_PRIVATE_KEY: {{ .Values.jwt.privateKey | quote }}

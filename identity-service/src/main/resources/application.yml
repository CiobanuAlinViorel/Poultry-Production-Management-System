# identity-service
spring:
  datasource:
    url: jdbc:postgresql://localhost:5436/ppms_iam
    username: ppms        # least-privilege DB role, only has access to identity schema
    password: ppms_dev
  jpa:
    properties:
      hibernate:
        default_schema: identity  # all JPA queries/DDL go to identity schema
  flyway:
    schemas: identity             # Flyway creates/owns this schema
    default-schema: identity      # Flyway's own metadata table (flyway_schema_history) also lives here
    locations:
      - classpath:db/migration
      - classpath:db/shared-migration
server:
  port: 8084

# JWT signing keypair — never hardcode real key material here, this file is
# committed to git. Local dev: put the real PEM values in application-local.yml
# (gitignored, loaded via the "local" profile). Deployed environments: set the
# JWT_PRIVATE_KEY / JWT_PUBLIC_KEY environment variables.
jwt:
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}

# identity-service
spring:
  datasource:
    url: jdbc:postgresql://localhost:5436/ppms_iam
    username: ppms        # least-privilege DB role, only has access to identity schema
    password: ppms_dev
  jpa:
    properties:
      hibernate:
        default_schema: identity  # all JPA queries/DDL go to identity schema
  flyway:
    schemas: identity             # Flyway creates/owns this schema
    default-schema: identity      # Flyway's own metadata table (flyway_schema_history) also lives here
    locations:
      - classpath:db/migration
      - classpath:db/shared-migration
server:
  port: 8084
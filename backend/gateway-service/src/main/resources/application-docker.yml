spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://identity-service:8084/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER_URI:ppms-identity}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ORIGINS:"http://localhost*","http://frontend*"}
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: identity-service
          uri: ${ROUTES_IDENTITY_URL:http://identity-service:8084}
          predicates:
            - Path=/api/identity/**
          filters:
            - RewritePath=/api/identity/(?<p>.*), /api/v1/$\{p}
        - id: admin-service
          uri: ${ROUTES_ADMIN_URL:http://admin-service:8085}
          predicates:
            - Path=/api/admin/**
          filters:
            - RewritePath=/api/admin/(?<p>.*), /api/v1/$\{p}
        - id: parent-flock-service
          uri: ${ROUTES_PARENT_FLOCK_URL:http://parent-flock-service:8081}
          predicates:
            - Path=/api/parent-flock/**
          filters:
            - RewritePath=/api/parent-flock/(?<p>.*), /api/v1/parent-flock/$\{p}
        - id: hatchery-service
          uri: ${ROUTES_HATCHERY_URL:http://hatchery-service:8082}
          predicates:
            - Path=/api/hatchery/**
          filters:
            - RewritePath=/api/hatchery/(?<p>.*), /api/v1/hatchery/$\{p}
        - id: farm-service
          uri: ${ROUTES_FARM_URL:http://farm-service:8083}
          predicates:
            - Path=/api/farm/**
          filters:
            - RewritePath=/api/farm/(?<p>.*), /api/v1/farm/$\{p}
        - id: slaughterhouse-service
          uri: ${ROUTES_SLAUGHTERHOUSE_URL:http://slaughterhouse-service:8086}
          predicates:
            - Path=/api/slaughterhouse/**
          filters:
            - RewritePath=/api/slaughterhouse/(?<p>.*), /api/v1/slaughterhouse/$\{p}
        - id: notification-service
          uri: ${ROUTES_NOTIFICATION_URL:http://notification-service:8087}
          predicates:
            - Path=/api/notification/**
          filters:
            - RewritePath=/api/notification/(?<p>.*), /api/v1/notification/$\{p}
        - id: reporting-service
          uri: ${ROUTES_REPORTING_URL:http://reporting-service:8088}
          predicates:
            - Path=/api/reporting/**
          filters:
            - RewritePath=/api/reporting/(?<p>.*), /api/v1/reporting/$\{p}

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8082
server.servlet.context-path=/broiler-farm

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/broiler_farm
spring.datasource.username=postgres
spring.datasource.password=Al1n@15
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# ===============================
# JPA/HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# ===============================
# FLYWAY CONFIGURATION
# ===============================
spring.flyway.enabled=false

# ===============================
# JWT CONFIGURATION
# ===============================
# Secret key pentru semnarea JWT (256-bit pentru HS256)
jwt.secret.key=4P6/t9jKjS904vvn30QKqrWicIpVFFQOA0SGuazWmrY=
# Expirare token: 86400000 ms = 24 ore
jwt.expiration=86400000

# ===============================
# SECURITY CONFIGURATION
# ===============================
# Dezactiveaz? autentificarea default Spring Security
spring.security.user.name=admin
spring.security.user.password=admin

# ===============================
# ERROR HANDLING
# ===============================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=true
server.error.whitelabel.enabled=false

# ===============================
# LOGGING CONFIGURATION
# ===============================
# General application logging
logging.level.com.example.broilerfarm=DEBUG
logging.level.com.example.shared=DEBUG

# Spring Security logging
logging.level.org.springframework.security=DEBUG

# Database and Transaction logging
logging.level.org.springframework.transaction.interceptor=TRACE
logging.level.org.springframework.dao=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG

# Hibernate SQL logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ===============================
# JACKSON CONFIGURATION (JSON)
# ===============================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/Bucharest

# ===============================
# MULTIPART FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# ACTUATOR (optional - pentru monitoring)
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
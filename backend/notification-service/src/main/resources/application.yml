spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ppms_notification
    username: ppms
    password: ppms_dev
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification
  flyway:
    schemas: notification
    default-schema: notification
    locations:
      - classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service

server:
  port: 8087

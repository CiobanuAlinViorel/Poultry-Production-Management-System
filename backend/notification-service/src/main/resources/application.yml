spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ppms_notification
    username: ppms
    password: ppms_dev
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification
  flyway:
    schemas: notification
    default-schema: notification
    locations:
      - classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    default-encoding: UTF-8

server:
  port: 8087

ppms:
  mail:
    from-name: PPMS
